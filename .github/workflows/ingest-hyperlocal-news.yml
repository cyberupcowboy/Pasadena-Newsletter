name: Ingest Hyperlocal News

on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: read

concurrency:
  group: ingest-hyperlocal-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate collector
        run: node --check scripts/ingest-local-news.mjs

      - name: Ingest Pasadena-area health, local news, and school updates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://eedpedkvymohcubdaoey.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: node scripts/ingest-local-news.mjs
