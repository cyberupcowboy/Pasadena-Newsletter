name: Deploy Pasadena Current

on:
  push:
    branches:
      - main
    paths:
      - 'public-site/**'
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate browser scripts
        run: |
          node --check public-site/app.js
          node --check public-site/submit/app.js
          node --check dashboard/app.js
          node --check dashboard/community.js

      - name: Build Pages artifact
        run: |
          mkdir -p _site/editorial
          cp -R public-site/. _site/
          cp -R dashboard/. _site/editorial/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
