name: Validate Community Moderation Workflow

on:
  push:
    branches:
      - feature/community-moderation-workflow
    paths:
      - 'dashboard/community-workflow.js'
      - 'dashboard/community-workflow.css'
      - 'dashboard/index.html'
      - 'supabase/migrations/0016_add_community_deferred_workflow.sql'
      - '.github/workflows/validate-community-moderation-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate newsroom scripts
        run: |
          node --check dashboard/community.js
          node --check dashboard/community-approval-ux.js
          node --check dashboard/community-workflow.js
