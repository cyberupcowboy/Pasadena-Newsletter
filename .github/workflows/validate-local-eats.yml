name: Validate Local Eats

on:
  push:
    branches:
      - feature/local-eats
    paths-ignore:
      - '.qa/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: feature/local-eats
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate Local Eats scripts
        run: |
          node --check public-site/story-links.js
          node --check public-site/local-eats-home.js
          node --check public-site/eats/eats.js
          node --check public-site/directory/directory.js
          node --check dashboard/community-approval-ux.js
          node --check dashboard/local-eats-admin.js
      - name: Mark successful validation
        run: |
          mkdir -p .qa
          printf 'validated_commit=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .qa/local-eats-passed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .qa/local-eats-passed.txt
          git commit -m 'chore: record Local Eats validation' || exit 0
          git push origin HEAD:feature/local-eats
