name: Test Community AI Editorial Review

on:
  push:
    branches:
      - feature/community-ai-editorial-review
    paths:
      - 'scripts/process-community-submissions.mjs'
      - 'prompts/community-copy-desk.md'
      - 'dashboard/community.js'
      - 'dashboard/community.css'
      - 'supabase/migrations/0012_add_community_ai_editorial_review.sql'
      - 'supabase/migrations/0013_require_fresh_community_ai_review.sql'
      - '.github/workflows/test-community-ai-editorial-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate JavaScript
        run: |
          node --check dashboard/community.js
          node --check scripts/process-community-submissions.mjs
      - name: Run AI editorial smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://eedpedkvymohcubdaoey.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_ITEMS: '2'
        run: node scripts/process-community-submissions.mjs
