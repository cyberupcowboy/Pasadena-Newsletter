name: Moderate Community Comments

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: moderate-community-comments
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate comment moderator
        run: node --check scripts/moderate-community-comments.mjs
      - name: Screen pending comments
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://eedpedkvymohcubdaoey.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_ITEMS: '30'
        run: node scripts/moderate-community-comments.mjs
