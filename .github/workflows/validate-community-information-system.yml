name: Validate Community Information System

on:
  push:
    branches:
      - feature/community-information-system
    paths-ignore:
      - '.qa/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate browser and worker scripts
        run: |
          node --check public-site/app.js
          node --check public-site/community-system.js
          node --check public-site/story-links.js
          node --check public-site/lib/current.js
          node --check public-site/story/story.js
          node --check public-site/story/comment-reports.js
          node --check public-site/events/events.js
          node --check public-site/directory/directory.js
          node --check public-site/civic/civic.js
          node --check public-site/neighborhoods/neighborhoods.js
          node --check public-site/search/search.js
          node --check public-site/alerts/alerts.js
          node --check dashboard/app.js
          node --check dashboard/community.js
          node --check dashboard/community-approval-ux.js
          node --check dashboard/community-workflow.js
          node --check dashboard/newsroom-ops.js
          node --check scripts/moderate-community-comments.mjs
          node --check scripts/generate-newsletter-editions.mjs
      - name: Record successful QA
        run: |
          mkdir -p .qa
          printf 'validated_commit=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .qa/community-information-system-passed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .qa/community-information-system-passed.txt
          git commit -m 'Record community information system QA pass'
          git push origin HEAD:${GITHUB_REF_NAME}
