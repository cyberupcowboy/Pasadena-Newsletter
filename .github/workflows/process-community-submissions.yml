name: Process Community Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: process-community-submissions
  cancel-in-progress: false

jobs:
  copy-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate community processor
        run: node --check scripts/process-community-submissions.mjs

      - name: Prepare community submissions for editor review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: https://eedpedkvymohcubdaoey.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_ITEMS: '10'
        run: node scripts/process-community-submissions.mjs
